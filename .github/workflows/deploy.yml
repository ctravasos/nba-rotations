# Rebuilds the site every morning with last night's games and publishes it to GitHub Pages.
name: Build and deploy

on:
  schedule:
    # Several runs a day: GitHub often starts scheduled jobs hours late, so one daily run can
    # leave yesterday's slate up. Off the top of the hour, when GitHub's queue is lighter.
    # (UTC; roughly 6am, 10am, 2pm, 6pm Eastern)
    - cron: "23 11,15,19,23 * * *"
  workflow_dispatch:       # "Run workflow" button for manual rebuilds
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # Past seasons never change: cache raw files (play-by-play, box scores, NBA Cup game lists)
      # so only the current season downloads each run. A new key per run saves any newly added
      # files; restore-keys picks up the most recent cache.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - run: python run.py update --all
      - run: python run.py build
        env:
          # Pages serves project repos at /<repo>/; a <user>.github.io repo or custom domain is served at /
          SITE_BASE: ${{ !endsWith(github.event.repository.name, '.github.io') && format('/{0}', github.event.repository.name) || '' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
